<!doctype html>
<html lang="fr" class="passeport-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sur internet, tu n'as pas qu'une seule nationalité. Choisis les sites que tu utilises et découvre où vivent tes données et quelles lois s'appliquent à toi.">
  <!-- Meta Partage (Open Graph / Twitter) : remplacer https://VOTRE-DOMAINE.be par l'adresse réelle du site -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Passeport numérique">
  <meta property="og:title" content="Passeport numérique">
  <meta property="og:description" content="Sur internet, tu n'as pas qu'une seule nationalité. Choisis les sites que tu utilises et découvre où vivent tes données et quelles lois s'appliquent à toi.">
  <meta property="og:url" content="https://dylanvanpachterbeke.be/projets//passeport.html">
  <link rel="canonical" href="https://dylanvanpachterbeke.be/projets//passeport.html">
  <meta property="og:image" content="https://dylanvanpachterbeke.be/projets/assets/images/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Passeport numérique : deux anneaux montrant où sont les serveurs et quelles lois s'appliquent.">
  <meta property="og:locale" content="fr_BE">
  <meta property="og:locale:alternate" content="en_GB">
  <meta property="og:locale:alternate" content="nl_BE">
  <meta property="og:locale:alternate" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Passeport numérique">
  <meta name="twitter:description" content="Sur internet, tu n'as pas qu'une seule nationalité. Choisis les sites que tu utilises et découvre où vivent tes données et quelles lois s'appliquent à toi.">
  <meta name="twitter:image" content="https://dylanvanpachterbeke.be/projets/ilab/assets/images/og-image.png">
  <meta name="twitter:image:alt" content="Passeport numérique : deux anneaux montrant où sont les serveurs et quelles lois s'appliquent.">
  <!-- Favicon -->
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <meta name="theme-color" content="#000000">
  <title>Passeport numérique</title>
  <link rel="stylesheet" href="styles/app.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <script src="scripts/passeport.js" defer></script>
</head>
<body class="passeport">
  <a class="skip-link" href="#main-content" data-i18n="a11y.skip">Aller au contenu principal</a>
<div class="ecran">

  <!-- Barre du haut (maquette Figma) : accueil | langue -->
  <header class="barre-haut">
    <a id="btn-home" class="cellule" href="./index.html" aria-label="Accueil" data-i18n-aria="passeport.accueil_aria">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M4 18.5 20 5l16 13.5v17H24v-11h-8v11H4z" fill="currentColor"/>
        <path d="M1.5 17 20 1.5 38.5 17" fill="none" stroke="currentColor" stroke-width="4"/>
      </svg>
    </a>
    <!-- Choix de la langue : les textes viennent de assets/i18n/<code>.json -->
    <div class="langues" role="group" aria-label="Langue : français" data-i18n-aria="langue.aria">
      <button class="cellule cellule-langue" type="button" data-langue="fr" lang="fr" aria-label="Français" aria-pressed="true">FR</button>
      <button class="cellule cellule-langue" type="button" data-langue="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
      <button class="cellule cellule-langue" type="button" data-langue="nl" lang="nl" aria-label="Nederlands" aria-pressed="false">NL</button>
      <button class="cellule cellule-langue" type="button" data-langue="de" lang="de" aria-label="Deutsch" aria-pressed="false">DE</button>
    </div>
  </header>

  <main class="corps" id="main-content" tabindex="-1">
    <!-- Colonne gauche : choix des sites -->
    <section class="volet volet-gauche" aria-labelledby="titre-choix">
      <h1 data-i18n="passeport.titre">Passeport numérique</h1>
      <p class="intro" data-i18n="passeport.intro">
        Sur internet, tu n'as pas qu'une seule nationalité. Choisis les sites
        que tu utilises : on te montre où vivent tes données et quelles lois
        s'appliquent à toi.
      </p>

      <h2 id="titre-choix" class="sr-only" data-i18n="passeport.sites_titre">Tes sites</h2>
      <div id="marques" class="marques" role="group" aria-label="Sites à ajouter à ton passeport" data-i18n-aria="passeport.sites_aria">
        <p class="chargement" data-i18n="passeport.chargement">Chargement des sites…</p>
      </div>

      <div class="actions">
        <button id="btn-tout" class="btn" type="button" data-i18n="passeport.tout_choisir">Tout choisir</button>
        <button id="btn-reset" class="btn btn-discret" type="button" disabled data-i18n="passeport.recommencer">Recommencer</button>
      </div>
    </section>

    <!-- Colonne droite : résultats -->
    <section class="volet volet-droite" aria-labelledby="titre-resultats">
      <h2 id="titre-resultats" class="sr-only" data-i18n="passeport.resultats">Résultats</h2>

      <div class="camemberts">
        <figure class="graphique">
          <div class="donut-boite" id="donut-physique">
            <div class="donut-centre"><strong class="nb">0</strong><span class="unite">site</span></div>
          </div>
          <ul class="legende" id="legende-physique"></ul>
          <figcaption>
            <h3 data-i18n="passeport.physique.titre">Où sont les serveurs</h3>
            <p data-i18n="passeport.physique.description">Les pays où tes données sont stockées.</p>
          </figcaption>
        </figure>

        <figure class="graphique">
          <div class="donut-boite" id="donut-juridique">
            <div class="donut-centre"><strong class="nb">0</strong><span class="unite">site</span></div>
          </div>
          <ul class="legende" id="legende-juridique"></ul>
          <figcaption>
            <h3 data-i18n="passeport.juridique.titre">Quelles lois s'appliquent</h3>
            <p data-i18n="passeport.juridique.description">Les pays dont la loi peut atteindre tes données.</p>
          </figcaption>
        </figure>
      </div>

      <div class="bas">
        <section class="carte score" aria-labelledby="titre-score">
          <h3 id="titre-score" data-i18n="passeport.score.titre">Droits restants</h3>
          <p class="score-valeur"><span id="score-nombre">100</span><span class="score-max">/100</span></p>
          <div class="barre" role="progressbar" aria-labelledby="titre-score" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="score-barre" class="barre-remplie"></div></div>
          <p id="score-phrase" class="score-phrase" aria-live="polite"></p>
          <ul id="pertes" class="pertes"></ul>
        </section>

        <section class="carte dossier" aria-labelledby="titre-dossier">
          <h3 id="titre-dossier" data-i18n="passeport.dossier.titre">Dossier du site</h3>
          <div id="dossier" aria-live="polite"></div>
        </section>
      </div>

      <pre id="mrz" class="mrz" aria-hidden="true"></pre>
      <p id="avertissement" class="avertissement" data-i18n="passeport.avertissement"></p>
    </section>
  </main>

</div>
</body>
</html>
