<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Une exposition sur la citoyenneté à l'ère du web.">
  <title>Citoyen Ex — Exposition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/app.css">
  <script src="scripts/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="home-link" href="./index.html" aria-label="Accueil">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M4 18.5 20 5l16 13.5v17H24v-11h-8v11H4z" fill="currentColor"/>
        <path d="M1.5 17 20 1.5 38.5 17" fill="none" stroke="currentColor" stroke-width="4"/>
      </svg>
      <span class="brand-name">Citizen EX</span>
    </a>
    

    <div class="header-spacer" aria-hidden="true"></div>

    <button class="menu-toggle" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="main-navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" id="main-navigation" aria-label="Navigation principale">
      <a class="main-nav__link" href="./citizen.html" aria-current="page">Citizen Ex</a>
      <a class="main-nav__link" href="./artiste.html">Artiste</a>
      <a class="main-nav__link is-active" href="./courant.html">Courant artistique</a>
      <a class="main-nav__link" href="./oeuvres.html">Autres œuvres</a>
      <div class="language-label">Langues</div>
    </nav>
  </header>

  <main class="exhibition">
    <section class="exhibition-panel" aria-label="Présentation de l’exposition">
      <div class="slider__elements">
      <article class="intro intro--one slider__el slider__el--show" aria-labelledby="slide-title-1">
        <h1 id="slide-title-1" data-i18n="movement.title"></h1>
        <p data-i18n="movement.modern"></p>
        <p data-i18n="movement.conceptual"></p>
      </article>

      <article class="intro intro--two slider__el" aria-labelledby="slide-title-2">
        <h1 id="slide-title-2" data-i18n="movement.title.art.util"></h1>
        <p data-i18n="movement.social"></p>
      </article>

      <article class="intro intro--three slider__el" aria-labelledby="slide-title-3">
        <h1 id="slide-title-3" data-i18n="movement.title.art.util"></h1>
        <p data-i18n="movement.citizenex"></p>
      </article>
      </div>

      <nav class="slide-navigation" aria-label="Navigation des œuvres">
        <p class="slide-count" aria-live="polite" aria-atomic="true">
          <strong class="slide-count__number slide-count__number--one is-active">01</strong>
          <strong class="slide-count__number slide-count__number--two">02</strong>
          <strong class="slide-count__number slide-count__number--three">03</strong>
          <span> / 03</span>
        </p>
        <span class="mobile-next-label">L’artiste</span>
        <button class="slide-control slide-control--previous slider__btn--prev" type="button" aria-label="Œuvre précédente">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M34 20H7m0 0 12-12M7 20l12 12" fill="none" stroke="currentColor" stroke-width="3.5"/>
          </svg>
        </button>
        <button class="slide-control slide-control--next slider__btn--next" type="button" aria-label="Œuvre suivante">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <path d="M6 20h27m0 0L21 8m12 12L21 32" fill="none" stroke="currentColor" stroke-width="3.5"/>
          </svg>
        </button>
      </nav>
    </section>

    <div class="artwork-placeholder" role="img" aria-label="Zone de présentation de l’œuvre"></div>
  </main>
</body>
</html>
